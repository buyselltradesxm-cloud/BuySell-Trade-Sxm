project_id = "szhaxlmronirhnntlwyb"

[auth]
enabled = true
site_url = "https://buyselltradesxm.com"
additional_redirect_urls = [
  "buyselltradesxm://auth/callback",
  "https://buyselltradesxm.com",
  "https://buyselltradesxm.com/",
  "https://buyselltradesxm.com/marketplace.html",
  "http://localhost:5173",
  "http://localhost:5173/",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/"
]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Require a recent/verified recovery flow before a password can be changed.
secure_password_change = true
# Throttle all email-based auth messages. The Edge reset endpoint adds a
# stricter per-IP/per-email limit on top of this provider-level control.
max_frequency = "60s"
otp_length = 8
# Confirmation and recovery OTPs/links expire after 15 minutes.
otp_expiry = 900

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "noreply@buyselltradesxm.com"
sender_name = "Buy Sell Trade SXM"

# These endpoints authenticate with their own request-signature/rate-limit
# controls. `create-checkout` keeps the platform JWT check and also verifies
# the bearer token in the function.
[functions.request-password-reset]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# apple-purchases validates the bearer through Auth; notifications verify Apple's JWS.
[functions.apple-purchases]
verify_jwt = false

[functions.apple-notifications]
verify_jwt = false

# Authenticates with its own x-ops-secret header (polled by GitHub Actions).
[functions.ops-health]
verify_jwt = false

[functions.signup-code]
verify_jwt = false

