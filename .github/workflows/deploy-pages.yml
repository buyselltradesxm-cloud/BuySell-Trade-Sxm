name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Commits made with GITHUB_TOKEN do not trigger another push workflow.
  workflow_run:
    workflows: [Listing pages]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - uses: actions/configure-pages@v5
      - name: Version app assets to avoid stale CDN releases
        run: |
          npm run build:admob-plugin
          node scripts/version-assets.js
          node scripts/version-assets.js --check
          node --check app-index.js
          node --check app-marketplace.js
          node --check pro-studio.js
          node --check supabase-api.js
          node --check native-workflows.js
          node --check search-alerts.js
          node --check search-unsubscribe.js
          node --check admin-console.js
          node --check site-console.js
          node scripts/search-digest-check.js
          node --check analytics.js
          node --check app-review.js
          node scripts/app-growth-check.js
          node scripts/native-workflows-check.js
          npm run test:store-recovery
          node --check push-notifications.js
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify production artifact
        run: |
          test -f _site/app-index.js
          test -f _site/app-marketplace.js
          test -f _site/pro-studio.js
          test -f _site/pro-studio.css
          test -f _site/supabase-api.js
          test -f _site/native-workflows.js
          test -f _site/search-alerts.js
          test -f _site/search-alerts.css
          test -f _site/admin-console.js
          test -f _site/admin-console.css
          test -f _site/site-console.js
          test -f _site/admin/recovery.html
          test -f _site/search-unsubscribe.html
          test -f _site/app.html
          test -f _site/app-fr.html
          test -f _site/.well-known/assetlinks.json
          test -f _site/.well-known/apple-app-site-association
          test ! -e _site/scripts
          test ! -e _site/supabase
          test ! -e _site/APP_QA_STATUS.md
          node scripts/check-site-secrets.js _site
      # upload-pages-artifact v4 excludes all dot directories, including .well-known.
      - name: Archive Pages including verified app links
        run: |
          tar --dereference --hard-dereference --directory _site -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './.well-known/assetlinks.json'
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './.well-known/apple-app-site-association'
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
