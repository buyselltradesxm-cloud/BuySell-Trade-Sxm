name: Health check

# Every 6 hours: the live site serves what the app needs (and nothing it
# shouldn't), and the backend's scheduled jobs, email queue and Stripe events
# are healthy. A failed run makes GitHub email the repository owner.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Website serves the app
        run: |
          set -u
          SITE=https://buyselltradesxm.com
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SITE/$2?hc=$GITHUB_RUN_ID")
            if [ "$code" != "$1" ]; then echo "::error::/$2 returned $code (expected $1)"; fail=1; else echo "ok  $code /$2"; fi
          }
          for p in "" index.html marketplace.html supabase-config.js supabase-api.js captcha.js \
                   lib/supabase-2.74.0.min.js app-index.js app-marketplace.js sw.js \
                   privacy.html terms.html auth-callback.html ads.txt robots.txt; do
            check 200 "$p"
          done
          for p in supabase/schema.sql package.json SECURITY_DEPLOYMENT.md scripts/setup-app-review-accounts.js; do
            check 404 "$p"
          done
          home=$(curl -s --max-time 30 "$SITE/?hc=$GITHUB_RUN_ID")
          for needle in 'lib/supabase-2.74.0.min.js' 'captcha.js' 'supabase-api.js' 'Content-Security-Policy'; do
            echo "$home" | grep -q "$needle" || { echo "::error::home page no longer references $needle"; fail=1; }
          done
          exit $fail

      - name: Backend jobs, emails and payments are healthy
        env:
          OPS_HEALTH_SECRET: ${{ secrets.OPS_HEALTH_SECRET }}
        run: |
          if [ -z "$OPS_HEALTH_SECRET" ]; then echo "::error::OPS_HEALTH_SECRET is not set"; exit 1; fi
          code=$(curl -s -o health.json -w '%{http_code}' --max-time 60 -X POST \
            -H "x-ops-secret: $OPS_HEALTH_SECRET" \
            https://szhaxlmronirhnntlwyb.supabase.co/functions/v1/ops-health)
          cat health.json; echo
          if [ "$code" != "200" ]; then echo "::error::backend health check returned $code"; exit 1; fi
