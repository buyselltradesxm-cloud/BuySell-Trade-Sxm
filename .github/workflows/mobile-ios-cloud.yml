name: Mobile iOS Cloud Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "unsigned simulator build, or signed App Store IPA"
        required: true
        default: "simulator"
        type: choice
        options:
          - simulator
          - app-store
      upload_to_appstore:
        description: "app-store only: also upload the IPA to App Store Connect / TestFlight"
        required: false
        default: true
        type: boolean
      marketing_version:
        description: "app-store only: CFBundleShortVersionString, e.g. 1.0.1 (optional)"
        required: false
        type: string
      smoke_test:
        description: "simulator only: run the app against this checkout's site and upload screenshots"
        required: false
        default: false
        type: boolean

# The build only reads the repo; signing/publishing use repository secrets.
permissions:
  contents: read

jobs:
  simulator-build:
    name: iOS simulator build
    if: ${{ github.event.inputs.build_type == 'simulator' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Point the app at this checkout (smoke test)
        if: ${{ github.event.inputs.smoke_test == 'true' }}
        run: |
          # The simulator shares the runner's network, so the site in this
          # checkout is served locally and native and page code run together.
          # Nothing here is committed or shipped.
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));c.server.url='http://localhost:8080';c.server.cleartext=true;fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" \
            -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" ios/App/App/Info.plist

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS simulator app
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run in simulators and take screenshots (smoke test)
        if: ${{ github.event.inputs.smoke_test == 'true' }}
        run: |
          node scripts/ios-smoke-server.js 8080 >/dev/null 2>&1 &
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          BUNDLE=com.korekdigitalmarketing.buyselltradesxm
          SHOTS="$RUNNER_TEMP/shots"
          test -d "$APP"
          mkdir -p "$SHOTS"
          for i in $(seq 1 20); do curl -s -o /dev/null http://localhost:8080/index.html && break; sleep 1; done
          # Newest available device whose name starts with the given prefix.
          pick() {
            xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=sorted((k,x['name'],x['udid']) for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith(sys.argv[1])); print(c[-1][2] if c else '')" "$1"
          }
          for DEVICE in "iPhone 1" "iPad Pro"; do
            UDID="$(pick "$DEVICE")"
            test -n "$UDID" || { echo "::warning::no simulator named $DEVICE*"; continue; }
            NAME="$(echo "$DEVICE" | tr -d ' ' | tr '[:upper:]' '[:lower:]')"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            # A plain launch, then tabs opened the way a home screen shortcut does.
            for TAB in launch messages alerts; do
              xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
              if [ "$TAB" = launch ]; then
                xcrun simctl launch "$UDID" "$BUNDLE"
              else
                xcrun simctl launch "$UDID" "$BUNDLE" -sxmTab "$TAB"
              fi
              sleep 20
              xcrun simctl io "$UDID" screenshot "$SHOTS/$NAME-$TAB.png"
            done
            xcrun simctl shutdown "$UDID" || true
          done
          ls -la "$SHOTS"

      - name: Upload simulator screenshots (smoke test)
        if: ${{ always() && github.event.inputs.smoke_test == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-screenshots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: warn

  app-store-ipa:
    name: Signed iOS IPA
    if: ${{ github.event.inputs.build_type == 'app-store' }}
    runs-on: macos-latest
    env:
      APP_BUNDLE_ID: com.korekdigitalmarketing.buyselltradesxm
      APPLE_TEAM_ID: CJ7X9S5JDT
      ARCHIVE_PATH: /tmp/BuySellTradeSXM.xcarchive
      EXPORT_PATH: /tmp/ios-export
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require App Store Connect secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          missing=""
          [ -z "$APP_STORE_CONNECT_KEY_ID" ] && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ] && missing="$missing APP_STORE_CONNECT_API_KEY_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing — see APPLE_APPSTORE_SETUP.md. Use build_type=simulator to test compilation without secrets."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Override marketing version
        if: ${{ github.event.inputs.marketing_version != '' }}
        env:
          MARKETING_VERSION: ${{ github.event.inputs.marketing_version }}
        run: |
          if ! printf '%s' "$MARKETING_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::marketing_version must look like 1.0 or 1.0.1"; exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" ios/App/App/Info.plist || \
          echo "::warning::could not set CFBundleShortVersionString; project uses MARKETING_VERSION build setting"

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          test -s "$KEY_PATH" || { echo "::error::decoded .p8 is empty — check APP_STORE_CONNECT_API_KEY_BASE64"; exit 1; }
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Create export options
        run: |
          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Archive iOS app (unsigned)
        run: |
          # Archive WITHOUT signing. A brand-new team with no registered
          # devices can't mint the development profile that a signed archive
          # would demand, and pinning "Apple Distribution" conflicts with
          # automatic style. Signing is done entirely at export, where
          # method=app-store-connect + signingStyle=automatic +
          # -allowProvisioningUpdates + the ASC API key create the
          # cloud-managed distribution cert and App Store profile.
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Prepare embedded frameworks for distribution signing
        run: |
          # The archive is unsigned, but binary SDKs can retain their vendor's
          # designated requirements. Remove those signatures from the archive
          # copy so export signs every framework for this app's distribution team.
          FRAMEWORKS="$ARCHIVE_PATH/Products/Applications/App.app/Frameworks"
          if [ -d "$FRAMEWORKS" ]; then
            while IFS= read -r -d '' framework; do
              if codesign -d "$framework" >/dev/null 2>&1; then
                codesign --remove-signature "$framework"
              fi
            done < <(find "$FRAMEWORKS" -depth -type d -name '*.framework' -print0)
          fi

      - name: Carry entitlements into the archive
        run: |
          # The archive is unsigned, so it holds no entitlements and the export
          # would sign the app without Sign in with Apple. An ad-hoc signature
          # is enough to carry them: the export replaces it with the
          # distribution signature and keeps the entitlements it found.
          APP="$ARCHIVE_PATH/Products/Applications/App.app"
          if [ -d "$APP/Frameworks" ]; then
            while IFS= read -r -d '' framework; do
              codesign --force --sign - "$framework"
            done < <(find "$APP/Frameworks" -depth -type d -name '*.framework' -print0)
          fi
          codesign --force --sign - --entitlements ios/App/App/App.entitlements "$APP"
          codesign -d --entitlements - "$APP"

      - name: Export signed IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Verify exported distribution signatures
        run: |
          IPA_PATH="$(find "$EXPORT_PATH" -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          VERIFY_PATH="$RUNNER_TEMP/verify-ios-ipa"
          mkdir -p "$VERIFY_PATH"
          ditto -x -k "$IPA_PATH" "$VERIFY_PATH"
          APP_PATH="$VERIFY_PATH/Payload/App.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          # Sign in with Apple only works if the signed app carries its entitlement.
          codesign -d --entitlements - --xml "$APP_PATH" > "$RUNNER_TEMP/entitlements.plist"
          plutil -p "$RUNNER_TEMP/entitlements.plist"
          grep -q "com.apple.developer.applesignin" "$RUNNER_TEMP/entitlements.plist" || {
            echo "::error::the exported app is missing the Sign in with Apple entitlement"; exit 1; }
          # Push notifications need theirs too, and it must be the production one for the store.
          grep -A1 "aps-environment" "$RUNNER_TEMP/entitlements.plist" | grep -q "production" || {
            echo "::error::the exported app is missing the production push (aps-environment) entitlement"; exit 1; }
          REQUIREMENT='anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.1] exists and certificate leaf[field.1.2.840.113635.100.6.1.4] exists'
          codesign --verify -R="$REQUIREMENT" "$APP_PATH"
          while IFS= read -r -d '' framework; do
            codesign --verify --strict -R="$REQUIREMENT" "$framework"
          done < <(find "$APP_PATH/Frameworks" -type d -name '*.framework' -print0)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BuySellTradeSXM-iOS-IPA
          path: /tmp/ios-export/*.ipa
          if-no-files-found: error

      - name: Upload build to App Store Connect
        if: ${{ github.event.inputs.upload_to_appstore != 'false' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH="$(find "$EXPORT_PATH" -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH" || { echo "::error::no .ipa found to upload"; exit 1; }
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
