name: Listing pages

# Every 6 hours: rebuild the static page of each real listing (l/<id>.html)
# and sitemap.xml so search engines can index listings. Commits only when
# something changed; GitHub Pages then republishes the site.
on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listing-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build listing pages and sitemap
        run: node scripts/build-listing-pages.js

      - name: Commit if changed
        run: |
          git add -A l sitemap.xml 2>/dev/null || git add sitemap.xml
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update listing pages and sitemap"
          git push
