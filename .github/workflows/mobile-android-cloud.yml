name: Mobile Android Cloud Build

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to publish to (or 'none' to only build the AAB)"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - internal
          - alpha
          - beta
          - production
      version_name:
        description: "versionName, e.g. 1.0.1 (optional)"
        required: false
        type: string

# The build only reads the repo; signing/publishing use repository secrets.
permissions:
  contents: read

jobs:
  android:
    name: Signed Android App Bundle
    runs-on: ubuntu-latest
    env:
      APP_ID: com.korekdigitalmarketing.buyselltradesxm
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Verify shared marketplace workflows
        run: npm run test:native-workflows

      # Push notifications: the Firebase client config is kept out of git and
      # written here from a repository secret. Without it the app still builds
      # but cannot receive notifications.
      - name: Add Firebase config (google-services.json)
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::FIREBASE_GOOGLE_SERVICES_JSON_BASE64 is not set — this build cannot receive push notifications."
            exit 0
          fi
          echo -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          node scripts/check-google-services.js android/app/google-services.json "$APP_ID"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Check the push plugin is in the Android build
        run: |
          grep -q "capacitor-push-notifications" android/app/capacitor.build.gradle android/capacitor.settings.gradle \
            || { echo "::error::@capacitor/push-notifications was not synced into the Android project"; exit 1; }

      - name: Build installable Android preview
        working-directory: android
        # The Firebase config only lists the Play package, not the preview's ".preview" one, and the
        # google-services plugin fails on a package it does not know: build the preview without Firebase
        # (no push in the preview APK), then put the config back for the Play bundle.
        run: |
          if [ -f app/google-services.json ]; then mv app/google-services.json "$RUNNER_TEMP/google-services.json"; fi
          ./gradlew assembleDebug --no-daemon
          if [ -f "$RUNNER_TEMP/google-services.json" ]; then mv "$RUNNER_TEMP/google-services.json" app/google-services.json; fi

      - name: Upload Android preview APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BuySellTradeSXM-android-preview-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — cannot produce a signed bundle."
            exit 1
          fi
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Compute versionCode
        run: echo "ANDROID_VERSION_CODE=$(( ${{ github.run_number }} + 1 ))" >> "$GITHUB_ENV"

      - name: Build release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify the bundle is signed
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"
          test -n "$AAB" || { echo "::error::no .aab produced"; exit 1; }

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BuySellTradeSXM-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Check for Play service account
        id: play_sa
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON not set — built the AAB, skipping the Play upload."
          fi

      - name: Publish to Google Play
        if: ${{ github.event.inputs.track != 'none' && steps.play_sa.outputs.present == 'true' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.korekdigitalmarketing.buyselltradesxm
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track }}
          status: completed
