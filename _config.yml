# GitHub Pages builds this repo's root with Jekyll and publishes every file it
# finds. Only the website belongs on buyselltradesxm.com -- keep the database
# schema, ops scripts, QA scripts, native projects and setup docs off the
# production domain. (The repository itself is public; this is about not
# serving them from the site, and it shrinks what the site exposes.)
#
# When adding a new non-site file or folder at the root, list it here.
exclude:
  # backend, tooling, native projects
  # NOTE: Jekyll matches a plain entry as a path PREFIX, so a bare "supabase"
  # also removed supabase-api.js and supabase-config.js from the site. The
  # glob only matches files inside the folder.
  - "supabase/*"
  - scripts
  - android
  - ios
  - mobile-shell
  - node_modules
  - package.json
  - package-lock.json
  - deno.lock
  - capacitor.config.json
  - GITHUB_EMAIL_QUEUE_WORKFLOW.example.yml
  # QA scripts
  - backend-health-qa.js
  - email-queue-worker-qa.js
  - live-admin-access-qa.js
  - live-supabase-flow-qa.js
